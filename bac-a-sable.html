<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Bac à sable · balise parc-calendrier</title>
<style>
:root{--green:#91ab2a;--navy:#00212d;--pale:#edf1dc;--ink:#07242d;--muted:#738083;--line:#e6eaea}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,-apple-system,sans-serif;color:var(--ink);background:#f5f5ef;font-size:13px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
h1{font-size:16px;margin:0;font-weight:600}h1 small{font-weight:400;color:var(--muted);margin-left:8px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
select,button{font:inherit;font-size:12px;color:var(--ink);border:1px solid #cfd6cf;background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer}
button.primary{background:var(--green);border-color:var(--green);color:#172900;font-weight:600}
button:hover,select:hover{border-color:#9aa89a}
main{padding:18px 24px 40px;display:grid;gap:12px}
textarea{width:100%;min-height:170px;resize:vertical;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:14px;border:1px solid #cfd6cf;border-radius:10px;background:#fff;color:var(--navy);tab-size:2}
textarea:focus,select:focus-visible,button:focus-visible{outline:3px solid #347085;outline-offset:2px}
.status{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.preview{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;justify-content:center}
iframe{display:block;border:1px dashed #d5dccd;border-radius:8px;width:100%;max-width:var(--w,100%);height:var(--h,700px);background:#fff;transition:max-width .2s}
@media(max-width:700px){header,main{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<header>
 <h1>Bac à sable <small>écris du HTML, il s’affiche en dessous</small></h1>
 <div class="controls">
  <label>Insérer <select id="insert" aria-label="Insérer une balise"><option value="">une balise…</option><option value="taniere">La Tanière</option><option value="refuge">Le Refuge</option><option value="trappeur">La Cabane du Trappeur</option><option value="asian">Asian Lodge</option><option value="grange">La Grange (thème nuit)</option><option value="moulin">Le Moulin</option><option value="tous">Tous les hébergements (2 mois)</option><option value="script">la ligne de script</option><option value="secours">un lien de secours</option></select></label>
  <label>Largeur <select id="width" aria-label="Largeur de l’aperçu"><option value="100%">bureau</option><option value="768px">tablette</option><option value="390px">mobile</option></select></label>
  <button id="run" class="primary" type="button">Afficher</button>
  <button id="reset" type="button">Exemple</button>
 </div>
</header>
<main>
 <textarea id="code" spellcheck="false" aria-label="HTML à tester" placeholder="Colle ici du HTML, par exemple une balise <parc-calendrier>…"></textarea>
 <div class="status"><span id="info">Mise à jour automatique à chaque frappe, ou ⌘/Ctrl + Entrée.</span><span id="size"></span></div>
 <div class="preview"><iframe id="frame" title="Aperçu du HTML saisi"></iframe></div>
</main>
<script>
(() => {
 const SITE = 'https://www.parc-animalier-pyrenees.com/medias_front/pages/';
 const ENGINE = 'https://www.secure-hotel-booking.com/d-edge/Parc-Animalier-Des-Pyrenees/JLPH/';
 const SCRIPT = '<script src="parc-calendrier.js" defer><\/script>';
 const SECOURS = `  <a href="${ENGINE}">Réserver sur le moteur officiel</a>`;
 const tag = (attrs, photo) => `<parc-calendrier ${attrs} photo="${SITE}${photo}">\n${SECOURS}\n</parc-calendrier>`;
 const TAGS = {
  taniere: tag('logement="taniere"', '033817taniere.jpg'),
  refuge: tag('logement="refuge"', '042005ecolodge_le_refuge_pap-19.jpg'),
  trappeur: tag('logement="trappeur"', '115802trappeur.jpg'),
  asian: tag('logement="asian"', '011910shutterstock_32201191.jpg'),
  grange: tag('logement="grange" adultes="4" theme="nuit"', '115115la_grange_parc_animalier_des_pyrenees-33.jpg'),
  moulin: tag('logement="moulin"', '114008le_moulin_parc_animalier_des_pyrenees-21.jpg'),
  tous: tag('logement="tous" mois="2"', '045810035120000437parcanimalierdespyrenees-ayzacost-photoaspheries.jpg'),
  script: SCRIPT,
  secours: SECOURS.trim()
 };
 const EXAMPLE = `${SCRIPT}\n\n${TAGS.taniere}`;
 const code = document.getElementById('code'), frame = document.getElementById('frame'), info = document.getElementById('info'), size = document.getElementById('size');
 const store = {get: () => {try {return localStorage.getItem('bac-a-sable');} catch (e) {return null;}}, set: v => {try {localStorage.setItem('bac-a-sable', v);} catch (e) {}}};
 let timer;
 function render() {
  const html = code.value;
  frame.srcdoc = `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:16px;font-family:system-ui,sans-serif}</style></head><body>${html}</body></html>`;
  size.textContent = `${html.length} caractère${html.length > 1 ? 's' : ''}`;
  store.set(html);
 }
 function fit() {
  try {const doc = frame.contentDocument; if (doc && doc.documentElement) frame.style.setProperty('--h', Math.max(300, doc.documentElement.scrollHeight + 24) + 'px');} catch (e) {}
 }
 code.addEventListener('input', () => {clearTimeout(timer); timer = setTimeout(render, 350);});
 code.addEventListener('keydown', e => {if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {e.preventDefault(); clearTimeout(timer); render();}});
 document.getElementById('run').addEventListener('click', () => {clearTimeout(timer); render();});
 document.getElementById('reset').addEventListener('click', () => {code.value = EXAMPLE; render();});
 document.getElementById('width').addEventListener('change', e => {frame.style.setProperty('--w', e.target.value);});
 document.getElementById('insert').addEventListener('change', e => {
  const snippet = TAGS[e.target.value]; e.target.value = '';
  if (!snippet) return;
  const start = code.selectionStart, end = code.selectionEnd, before = code.value.slice(0, start), after = code.value.slice(end);
  const glue = before && !before.endsWith('\n') ? '\n\n' : '';
  code.value = before + glue + snippet + (after.startsWith('\n') || !after ? '' : '\n') + after;
  code.focus(); code.selectionStart = code.selectionEnd = (before + glue + snippet).length;
  render();
 });
 frame.addEventListener('load', fit);
 setInterval(fit, 600);
 code.value = store.get() || EXAMPLE;
 render();
})();
</script>
</body>
</html>
